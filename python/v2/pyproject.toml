[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replicar"
version = "2.0.0.dev0"
description = "Read replicar files: Rocket League replays reconstructed as RocketSim states"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
