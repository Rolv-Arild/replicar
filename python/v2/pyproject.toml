[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replicar"
version = "2.0.2"
description = "Read replicar files: Rocket League replays reconstructed as RocketSim states"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[project.optional-dependencies]
convert = ["replicar-native==2.0.2"]
rocketsim = ["rocketsim>=2.1.1"]
rlgym = ["rlgym-rocket-league>=2.0.1", "rocketsim>=2.1.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replicar = ["py.typed"]
