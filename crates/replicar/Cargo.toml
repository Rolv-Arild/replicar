[package]
name = "replicar"
version = "2.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rocket League replays reconstructed as RocketSim states, with the scoreboard, controls, events and provenance"
readme = "../../README.md"
keywords = ["rocket-league", "rocketsim", "replay", "simulation"]
categories = ["simulation", "parser-implementations"]

[dependencies]
boxcars.workspace = true
# `Quat`, which RocketSim's re-export of glam lacks; the same pin as RocketSim's, so the types unify.
glam.workspace = true
replicar-format = { path = "../replicar-format", version = "2.0.2" }
rocketsim.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
