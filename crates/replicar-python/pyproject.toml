[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "replicar-native"
version = "2.0.2"
description = "The native part of replicar: convert Rocket League replays to replicar files and resimulate them"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "replicar_native"
