[package]
name = "replicar-cli"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["rocket-league", "rocketsim", "replay", "simulation"]
categories = ["simulation", "parser-implementations"]
description = "The replicar command: Rocket League replays to RocketSim states in one Parquet file per replay"

[[bin]]
name = "replicar"
path = "src/main.rs"
# Its docs would overwrite the library's (the same name); its usage is `replicar --help`.
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# The system allocator serializes the conversion threads on Windows (RESULTS.md, "v2: corpus throughput").
mimalloc = { version = "0.1", default-features = false }
replicar = { path = "../replicar", version = "2.0.1" }
replicar-format = { path = "../replicar-format", version = "2.0.1" }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
