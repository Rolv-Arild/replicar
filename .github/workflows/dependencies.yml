# Keeps replicar on the newest compatible RocketSim and boxcars (the newest is assumed best): daily, it updates both in
# Cargo.lock; if that changes the lock, it runs the checks of ci.yml with the new lock, commits it to master when they
# pass, and rebuilds the latest release's native wheels with a wheel build number (release.yml), so pip users get the
# new simulator without a replicar release. A failing check leaves master as it was and shows as a failed run.
name: dependencies

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: newest RocketSim and boxcars
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      summary: ${{ steps.update.outputs.summary }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - id: update
        run: |
          cargo update -p rocketsim -p boxcars
          version() { grep -A1 "^name = \"$1\"$" Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p'; }
          summary="rocketsim $(version rocketsim), boxcars $(version boxcars)"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Cargo.lock already has $summary"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Cargo.lock updated: $summary"
          fi
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  incompatible:
    # A release outside the requirement in Cargo.toml (RocketSim 0.3 against "0.2.9") needs a change here: the update
    # above never reaches it, so it opens an issue (once per release) instead.
    name: newer incompatible releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for crate in rocketsim boxcars; do
            required=$(sed -n "s/^$crate = \(\"\|{ version = \"\)\([0-9.]*\)\".*/\2/p" Cargo.toml)
            newest=$(curl -sf -A "replicar dependency check (github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$crate" | jq -r .crate.max_stable_version)
            echo "$crate: required $required, newest $newest"
            # Compatible (Cargo's caret rule): the same leftmost non-zero component.
            key() { awk -F. '{ if ($1 != "0") print $1; else if ($2 != "0") print "0." $2; else print "0.0." $3 }' <<< "$1"; }
            if [ -z "$required" ] || [ -z "$newest" ] || [ "$newest" = null ]; then
              echo "::warning::could not compare $crate (required '$required', newest '$newest')"
            elif [ "$(key "$required")" != "$(key "$newest")" ]; then
              title="$crate $newest is out (outside the requirement \"$required\")"
              if [ -z "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
                gh issue create --title "$title" --body "The daily dependency check found $crate $newest on crates.io. Cargo.toml requires a release compatible with $required, so the automatic update does not reach it: port replicar to it, measure it (RESULTS.md, \"RocketSim 0.2.8 and 0.2.9\"), and raise the requirement."
              fi
            fi
          done

  test:
    name: test (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked --exclude replicar-v1

  commit:
    name: commit the lock and rebuild the wheels
    needs: [check, test]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Cargo.lock: ${{ needs.check.outputs.summary }}"
          git push origin HEAD:master
      - name: Rebuild the latest release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          echo "rebuilding $tag with build number ${{ github.run_number }}"
          # The workflow as on master (fixes apply without retagging), the code as released.
          gh workflow run release.yml --ref master -f ref="$tag" -f build_number=${{ github.run_number }}
