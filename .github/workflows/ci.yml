# Tests on Linux and Windows. The tests that need collision meshes or replays (not in the repository) skip; version
# 1's unit tests need the meshes and run locally only.
name: ci

on:
  push:
  pull_request:
  # Weekly, so that a new RocketSim release is tested even when nothing here changes.
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The native module (pyo3, stable ABI from 3.12) needs a Python 3.12 to build against.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # replicar takes the newest compatible RocketSim (assumed best): test with it, not only the one in the lock.
      - name: Newest RocketSim
        run: cargo update -p rocketsim
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Version 1's unit tests build RocketSim arenas, which need the game's collision meshes (not in the repository):
      # they run locally. v2's tests skip what needs meshes or replays.
      - name: Rust tests
        run: cargo test --workspace --all-targets --exclude replicar-v1
      - name: Python reader tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python/v2[test]
          python -m pytest python/v2/tests
      - name: Native module
        run: |
          python -m pip install maturin
          maturin build --release -m crates/replicar-python/Cargo.toml -o dist
          python -m pip install --find-links dist replicar-native
          python -c "import replicar_native; print(replicar_native.version())"
