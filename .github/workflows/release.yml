# Builds what a release ships, as workflow artifacts: the native wheels (one abi3 wheel per platform, CPython 3.12+),
# the pure-Python reader (wheel and sdist), and the `replicar` command for each platform.
#
# With `build_number` (dependencies.yml sets it when RocketSim or boxcars has a new release), the native wheels get
# that wheel build number (`replicar_native-<version>-<n>-...`, which pip prefers to the release's own wheels) and the
# reader is not rebuilt: the same release, with the newest dependencies.
#
# Publishing to PyPI runs only when the repository variable PUBLISH_PYPI is `true` and PyPI trusts this workflow
# (trusted publishing): `replicar-native` from the environment `pypi-native`, `replicar` from `pypi`; otherwise the
# artifacts are uploaded by hand.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (empty: the ref the workflow runs from)"
        required: false
        default: ""
      build_number:
        description: "Wheel build number (empty for a release's own wheels)"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  native-wheels:
    name: wheel (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: "" }
          # One wheel for Apple silicon and Intel Macs, built on the arm64 runner (the macos-13 Intel runner is gone).
          - { name: macos-universal2, runner: macos-14, target: universal2-apple-darwin, manylinux: "" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # Every build takes the newest compatible RocketSim and boxcars; the files it writes record which RocketSim.
      - run: cargo update -p rocketsim -p boxcars
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: "1.97.1"
          args: --release --out dist -m crates/replicar-python/Cargo.toml
      - name: Wheel build number
        if: inputs.build_number != ''
        shell: bash
        run: |
          python -m pip install wheel
          python -m wheel tags --build "${{ inputs.build_number }}" --remove dist/*.whl
          ls dist
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --find-links dist replicar-native ./python/v2
          python -c "import replicar, replicar_native; print(replicar_native.version())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl

  reader:
    name: reader (wheel and sdist)
    # The reader holds no RocketSim: a rebuild with a build number leaves it as released.
    if: inputs.build_number == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build python/v2 -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: reader
          path: dist/*

  command:
    name: command (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, binary: replicar }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, binary: replicar }
          - { name: windows-x86_64, runner: windows-latest, binary: replicar.exe }
          - { name: macos-aarch64, runner: macos-14, binary: replicar }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      # Every build takes the newest compatible RocketSim and boxcars; the files it writes record which RocketSim.
      - run: cargo update -p rocketsim -p boxcars
      - run: cargo build --release --locked -p replicar-cli
      - uses: actions/upload-artifact@v4
        with:
          name: replicar-${{ matrix.platform.name }}
          path: target/release/${{ matrix.platform.binary }}

  # One job per PyPI project: PyPI lets a workflow and environment be the trusted publisher of one pending project.
  publish-native:
    name: publish replicar-native to PyPI
    needs: native-wheels
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi-native
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: wheel-*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-reader:
    name: publish replicar to PyPI
    needs: reader
    # The reader is not rebuilt for a build-number rebuild, so there is nothing to publish then.
    if: vars.PUBLISH_PYPI == 'true' && inputs.build_number == ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: reader
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
